<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Платформер — Z-Lore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #joystick { position: absolute; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.35); z-index: 40; touch-action: none; display: none; }
    #joystick.active { display: block; }
    #joystick-knob { position: absolute; top: 50%; left: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255,255,255,0.55); pointer-events: none; }
    #jump-btn { position: absolute; right: 24px; bottom: 32px; width: 84px; height: 84px; border-radius: 50%; border: none; background: rgba(255,255,255,0.25); color: #fff; font-size: 1rem; font-weight: 600; z-index: 40; touch-action: none; display: none; }
    #jump-btn.active { display: block; }
    @media (pointer: coarse) { #joystick, #jump-btn { display: block; } }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from './three.module.min.js';
    window.THREE = THREE;
  </script>
  <script src="game.js" defer></script>
</body>
</html>
