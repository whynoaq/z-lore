<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Платформер — Z-Lore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui { position: absolute; top: 16px; left: 16px; pointer-events: none; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); z-index: 10; }
    #ui h1 { font-size: 1.25rem; margin-bottom: 4px; font-weight: 600; }
    .controls { font-size: 0.85rem; opacity: 0.9; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.7); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; display: none; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 1.2rem; pointer-events: none; z-index: 20; }
    #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; cursor: pointer; z-index: 30; text-align: center; padding: 24px; -webkit-tap-highlight-color: transparent; }
    #overlay h2 { font-size: 1.5rem; margin: 0; }
    #overlay p { font-size: 1rem; opacity: 0.9; }
    #btn-start {
      margin-top: 16px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      background: rgba(255,255,255,0.9);
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-start:active { background: #fff; }
    /* ---------- mobile controls ---------- */
    #mobile-controls {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
    }
    @media (pointer: coarse), (max-width: 768px) {
      #mobile-controls { display: block; }
      #crosshair { display: none !important; }
    }
    .mobile-stick-base {
      position: absolute;
      bottom: 70px;
      left: 40px;
      width: 110px;
      height: 110px;
      border: 3px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
    }
    .mobile-stick-knob {
      position: absolute;
      top: 50%; left: 50%;
      width: 46px; height: 46px;
      background: rgba(255,255,255,0.55);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .mobile-btn {
      position: absolute;
      bottom: 45px;
      right: 40px;
      width: 76px; height: 76px;
      background: rgba(255,255,255,0.5);
      border: 2px solid rgba(255,255,255,0.7);
      border-radius: 50%;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    .mobile-look-hint {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.65);
      font-size: 0.75rem;
      pointer-events: none;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>3D Платформер</h1>
    <div class="controls">WASD / стрелки — движение&nbsp;&bull;&nbsp;Пробел — прыжок&nbsp;&bull;&nbsp;Мышь — обзор</div>
  </div>
  <div id="crosshair"></div>
  <div id="loading">Загрузка…</div>
  <div id="overlay">
    <div>
      <h2>3D Платформер</h2>
      <button id="btn-start">Начать игру</button>
      <p style="font-size:0.8rem;opacity:0.8;margin-top:8px">WASD — движение • Пробел — прыжок • Мышь — обзор</p>
    </div>
  </div>
  <div id="mobile-controls">
    <div class="mobile-look-hint">Потяните правой половиной экрана для обзора</div>
    <div class="mobile-stick-base">
      <div class="mobile-stick-knob" id="stick-knob"></div>
    </div>
    <div class="mobile-btn" id="btn-jump">ПРЫЖОК</div>
  </div>
  <script src="https://unpkg.com/three@0.168.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
