<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Платформер — Z-Lore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; filter: brightness(0.7) contrast(1.25) saturate(0.6); }
    #joystick { position: absolute; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.35); z-index: 40; touch-action: none; display: none; }
    #joystick.active { display: block; }
    #joystick-knob { position: absolute; top: 50%; left: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255,255,255,0.55); pointer-events: none; }
    #jump-btn { position: absolute; right: 24px; bottom: 32px; width: 84px; height: 84px; border-radius: 50%; border: none; background: rgba(255,255,255,0.25); color: #fff; font-size: 1rem; font-weight: 600; z-index: 40; touch-action: none; display: none; }
    #jump-btn.active { display: block; }
    @media (pointer: coarse), (max-width: 768px) { #joystick, #jump-btn { display: block; } }
      #intro-text { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); color: #fff; font-size: 2rem; font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,0.8); z-index: 50; opacity: 0; transition: opacity 0.8s ease; pointer-events: none; }
    #intro-text.show { opacity: 1; }
    #intro-text.hide { opacity: 0; }
      #intro-fade { position: absolute; inset: 0; background: #000; z-index: 60; opacity: 1; transition: opacity 0.8s ease; pointer-events: none; }
    #intro-fade.hide { opacity: 0; }
      #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 15; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.6) 100%); mix-blend-mode: multiply; }
    #grain { position: absolute; inset: 0; pointer-events: none; z-index: 16; opacity: 0.18; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>"); background-size: 200px 200px; animation: grainMove 0.4s steps(2) infinite; }
    @keyframes grainMove { 0% { background-position: 0 0; } 25% { background-position: 50px 50px; } 50% { background-position: 100px 0; } 75% { background-position: 0 100px; } 100% { background-position: 0 0; } }
    #tint { position: absolute; inset: 0; pointer-events: none; z-index: 14; background: rgba(15,20,45,0.2); mix-blend-mode: color; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from './three.module.min.js';
    window.THREE = THREE;
  </script>
  <script src="game.js?v=40" defer></script>
</body>
</html>
