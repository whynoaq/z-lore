<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Платформер — Z-Lore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; }
    canvas { display: block; width: 100%; height: 100%; }

    #mobile-controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #look-area {
      position: absolute;
      top: 0; left: 0; right: 50%; bottom: 0;
      touch-action: none;
      cursor: none;
      pointer-events: none;
    }

    #stick-base {
      position: absolute;
      bottom: 80px; left: 80px;
      width: 120px; height: 120px;
      touch-action: none;
      cursor: none;
      pointer-events: none;
    }

    #stick-knob {
      position: absolute;
      top: 50%; left: 50%;
      width: 56px; height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      touch-action: none;
    }

    #btn-jump {
      position: absolute;
      bottom: 70px; right: 80px;
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: none;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      touch-action: none;
      cursor: pointer;
      pointer-events: auto;
    }
</head>
<body>
  <div id="mobile-controls">
    <div id="look-area"></div>
    <div id="stick-base">
      <div id="stick-knob"></div>
    </div>
    <div id="btn-jump"></div>
  </div>
  <script type="module">
    import * as THREE from './three.module.min.js';
    window.THREE = THREE;
  </script>
  <script src="game.js" defer></script>
</body>
</html>
